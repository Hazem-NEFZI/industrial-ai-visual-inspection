[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-visual-inspection"
version = "2.0.0"
description = "Aligned-reference inspection, bounded patch-memory anomaly detection, and a trainable CNN autoencoder."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hazem Nefzi"}]
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python-headless>=4.10,<5", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
app = ["streamlit>=1.40,<2", "pillow>=10,<14"]
deep = ["torch>=2.5,<3"]

[tool.setuptools.packages.find]
include = ["industrial_cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F"]
